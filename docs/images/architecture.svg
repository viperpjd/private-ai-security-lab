<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5b6472"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#76b900"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>

  <text x="48" y="58" font-size="28" font-weight="700" fill="#111827">The Private AI Security Lab</text>
  <text x="48" y="90" font-size="17" fill="#4b5563">Inference on the DGX Sparks. Tools, SIEM and approvals on the MS-A2. No internet egress.</text>

  <!-- Internet, blocked -->
  <g>
    <rect x="900" y="40" width="252" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="1026" y="66" text-anchor="middle" font-size="16" font-weight="600" fill="#991b1b">Internet</text>
    <text x="1026" y="86" text-anchor="middle" font-size="13" fill="#991b1b">blocked except update windows</text>
  </g>

  <!-- Lab boundary -->
  <rect x="32" y="124" width="1136" height="604" rx="16" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="56" y="154" font-size="13" font-weight="600" fill="#6b7280" letter-spacing="1.5">LAB NETWORK · VLAN-SEGMENTED</text>

  <!-- Analyst -->
  <g>
    <rect x="64" y="176" width="300" height="76" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="84" y="208" font-size="18" font-weight="600" fill="#111827">You (analyst)</text>
    <text x="84" y="232" font-size="14" fill="#4b5563">reviews and approves every action</text>
  </g>
  <path d="M214 252V300" stroke="#5b6472" stroke-width="1.75" fill="none" marker-end="url(#arr)"/>
  <text x="226" y="282" font-size="13" fill="#4b5563">TLS · approvals</text>

  <!-- MS-A2 control plane -->
  <g>
    <rect x="64" y="304" width="300" height="276" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="84" y="338" font-size="19" font-weight="700" fill="#111827">Minisforum MS-A2</text>
    <text x="84" y="360" font-size="14" fill="#2563eb">Ubuntu Server · control plane</text>
    <text x="84" y="376" font-size="12.5" fill="#6b7280">Ryzen 9 9955HX · 96 GB DDR5 · 2 TB</text>
    <g font-size="15" fill="#1f2937">
      <text x="84" y="410">• Model gateway and router</text>
      <text x="84" y="436">• Guard model and audit log</text>
      <text x="84" y="462">• Vector DB for threat-intel RAG</text>
      <text x="84" y="488">• Wazuh or Elastic SIEM</text>
      <text x="84" y="514">• Scanners and AI tools</text>
      <text x="84" y="540">• Supervised agent orchestrator</text>
    </g>
  </g>

  <!-- Spark A -->
  <g>
    <rect x="456" y="304" width="300" height="276" rx="10" fill="#f4fbe8" stroke="#76b900" stroke-width="2.5"/>
    <text x="476" y="338" font-size="19" font-weight="700" fill="#111827">DGX Spark A</text>
    <text x="476" y="360" font-size="14" fill="#4d7c0f">GB10 · 128 GB unified memory</text>
    <text x="476" y="376" font-size="12.5" fill="#6b7280">DGX OS (Ubuntu 24.04) · Docker</text>
    <g font-size="15" fill="#1f2937">
      <text x="476" y="410">Ollama specialists:</text>
      <text x="476" y="436">• Reasoning and decision</text>
      <text x="476" y="462">• Coding</text>
      <text x="476" y="488">• Security specialist</text>
      <text x="476" y="514">• Router, embeddings, guard</text>
      <text x="476" y="548" font-weight="600" fill="#4d7c0f">vLLM shard 1 (Part 20)</text>
    </g>
  </g>

  <!-- Spark B -->
  <g>
    <rect x="848" y="304" width="300" height="276" rx="10" fill="#ffffff" stroke="#76b900" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="868" y="338" font-size="19" font-weight="700" fill="#111827">DGX Spark B</text>
    <text x="868" y="360" font-size="14" fill="#4d7c0f">GB10 · 128 GB · joins in Part 19</text>
    <text x="868" y="376" font-size="12.5" fill="#6b7280">DGX OS (Ubuntu 24.04) · Docker</text>
    <g font-size="15" fill="#1f2937">
      <text x="868" y="410">Large reasoning model</text>
      <text x="868" y="436">split across A and B</text>
      <text x="868" y="462">(about 242 GiB together)</text>
      <text x="868" y="496">Overflow specialists</text>
      <text x="868" y="548" font-weight="600" fill="#4d7c0f">vLLM shard 2 (Part 20)</text>
    </g>
  </g>

  <!-- CP to Spark A -->
  <path d="M364 442H456" stroke="#5b6472" stroke-width="1.75" fill="none" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="410" y="430" text-anchor="middle" font-size="13" fill="#4b5563">10GbE</text>
  <text x="410" y="464" text-anchor="middle" font-size="13" fill="#4b5563">TLS API</text>

  <!-- QSFP link -->
  <path d="M606 580V628H998V580" stroke="#76b900" stroke-width="3" fill="none" marker-start="url(#arrG)" marker-end="url(#arrG)"/>
  <text x="802" y="652" text-anchor="middle" font-size="14" font-weight="600" fill="#4d7c0f">QSFP 200GbE · ConnectX-7 · dedicated, unrouted</text>

  <!-- Target range -->
  <path d="M214 580V624" stroke="#5b6472" stroke-width="1.75" fill="none" marker-end="url(#arr)"/>
  <text x="226" y="608" font-size="13" fill="#4b5563">scoped, approved scans</text>
  <g>
    <rect x="64" y="628" width="420" height="80" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.75"/>
    <text x="84" y="658" font-size="17" font-weight="600" fill="#111827">Isolated target range</text>
    <text x="84" y="682" font-size="14" fill="#9a3412">own VLAN · no internet · no route to the lab</text>
    <text x="84" y="700" font-size="12.5" fill="#6b7280">intentionally vulnerable apps and test VMs (Part 14)</text>
  </g>
</svg>
